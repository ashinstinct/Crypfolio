<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1e">
<title>Crypfolio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#0a0f1e;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#334155;outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#22d3ee;cursor:pointer}
.levSlider{-webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:1px;background:linear-gradient(90deg,#22d3ee calc(var(--pct,20%)),#2d3f52 calc(var(--pct,20%)));outline:none;cursor:pointer;display:block}
.levSlider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#22d3ee;cursor:pointer;box-shadow:0 0 0 3px rgba(34,211,238,0.18);border:2px solid #0a0f1e}
.levSlider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#22d3ee;cursor:pointer;box-shadow:0 0 0 3px rgba(34,211,238,0.18);border:2px solid #0a0f1e;box-sizing:border-box}
.levSlider::-moz-range-track{height:2px;border-radius:1px;background:#2d3f52}
.levSlider::-moz-range-progress{height:2px;border-radius:1px;background:#22d3ee}
::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.spin{animation:spin 1s linear infinite}
.grad{background:linear-gradient(90deg,#22d3ee,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sheet{animation:slideUp 0.28s ease}
.fade{animation:fadeIn 0.2s ease}
button{cursor:pointer;font-family:inherit}
.skeleton{background:linear-gradient(90deg,#1e293b 25%,#233041 50%,#1e293b 75%);background-size:200% 100%;animation:skshimmer 1.5s ease-in-out infinite}
@keyframes skshimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.chart-fs{position:fixed!important;inset:0!important;z-index:450!important;border-radius:0!important;background:#0a0f1e!important}
</style>
</head>

      {name:'Binance Cooling-Off Period',desc:'Pause Binance Futures trading for 1, 3, 7, 14 or 30 days. Also available: a permanent Futures ban.',col:'#F3BA2F',icon:'⏸',url:'https://www.binance.com/en/support/faq/how-to-use-binance-futures-cooling-off-period-feature-5a0d6a39afa84848863e7f738a70d99d',detail:'Binance Futures has two powerful self-exclusion tools:\n\n🔶 COOLING-OFF PERIOD\nOptions: 1 Day, 1 Week, 1 Month, or Indefinite. To activate: Futures → Account (top right) → Futures Settings → Cooling-Off Period → Enable toggle → Select duration → Confirm.\n\nDuring the period you cannot open new positions or place orders. You must close all open orders first.\n\n🔴 PERMANENT / INDEFINITE BAN\nSelect \"Indefinite\" to permanently disable Futures trading. This blocks USD-M Futures, COIN-M Futures, Futures Grid, TWAP and VP. Both available 24/7 in the Binance app.',img:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAwoAAAQSCAYAAAAPGg1ZAAAQAElEQVR4AeydB2BcS3X3z1Wz5KZi2ZaL3HvvvXf7VWqAQEICgYQeCIQWCAECXxqhhQBJgIQA4XX3+lyeey/Pz709P1e5d1uW9c1vdu/67mq7VtJKOrZm79zp85+ZM+ecKTejS68hlWoUA+0D2ge0D2gf0D6gfUD7gPYB7QPaB7x9IEP0nyKgCDQwBLQ6ioAioAgoAoqAIqAIVB8BFRSqj6GmoAgoAoqAIqAI1CwCmroioAgoAnWAgAoKdQC6ZqkIKAKKgCKgCCgCioAi0LgRqA+1V0GhPrSSllERUAQUAUVAEVAEFAFFQBGoZQRUUKhlwDW7+o6All8RUAQUAUVAEVAEFIHGgYAKCo2jnbWWioAioAgoApEQUHdFQBFQBBSBsAiooBAWFnVUBBQBRUARUAQUAUVAEaivCGi5U4OACgqpwVFTUQQUAUVAEVAEFAFFQBFQBBoUAiooNKjmrO+V0fIrAoqAIqAIKAKKgCKgCKQLAioopEtLaDkUAUVAEWiICGidFAFFQBFQBOotAioo1Num04IrAoqAIqAIKAKKgCJQ+whojo0HARUUGk9ba00VAUVAEVAEFAFFQBFQBBSBuBFQQSFuqOp7QC2/IqAIKAKKgCKgCCgCioAiED8CKijEj5WGVAQUAUUgvRDQ0igCioAioAgoAjWIgAoKNQiuJq0IKAKKgCKgCCgCikAiCGhYRSCdEFBBIZ1aQ8uiCCgCioAioAgoAoqAIqAIpAkCKiikpCE0EUVAEVAEFAFFQBFQBBQBRaBhIaCCQsNqT62NIqAIpAoBTUcRUAQUAUVAEWjkCKig0Mg7gFZfEVAEFAFFQBFoLAhoPRUBRSAxBFRQSAwvDa0IKAKKgCKgCCgCioAioAg0CgTqgaDQKNpBK6kIKAKKgCKgCCgCioAioAikFQIqKKRVc2hhFIFGgoBWUxFQBBQBRUARUATSHgEVFNK+ibSAioAioAgoAopA+iOgJVQEFIGGh4AKCg2vTbVGioAioAgoAoqAIqAIKAKKQHUREBUUqg2hJqAIKAKKgCKgCCg   /* Calculator Page - useRef pattern avoids stale closure crashes */
  function CalcPage(){
    /* Single state object — one setState = one re-render, no stale reads */
    var cs=useState({disp:'0',op:null,stored:null,fresh:false,expr:''});
    var S=cs[0];var setS=cs[1];

    function press(v){
      setS(function(s){
        var disp=s.disp,op=s.op,stored=s.stored,fresh=s.fresh,expr=s.expr;
        function fmt(n){return isNaN(n)?'0':String(Math.round(n*1e10)/1e10);}

        if(v==='C') return {disp:'0',op:null,stored:null,fresh:false,expr:''};
        if(v==='±') return Object.assign({},s,{disp:disp.charAt(0)==='-'?disp.slice(1):'-'+disp});
        if(v==='%') return Object.assign({},s,{disp:fmt(parseFloat(disp)/100)});
        if(v==='DEL') return Object.assign({},s,{disp:disp.length>1?disp.slice(0,-1):'0'});

        if(['+','-','×','÷'].includes(v)){
          var cur=parseFloat(disp)||0;
          /* Show running expression: "12 + " */
          if(op&&stored!==null&&!fresh){
            var r=op==='+'?stored+cur:op==='-'?stored-cur:op==='×'?stored*cur:cur!==0?stored/cur:0;
            var rr=Math.round(r*1e10)/1e10;
            return {disp:fmt(rr),op:v,stored:rr,fresh:true,expr:fmt(rr)+' '+v};
          }
          return {disp:fmt(cur),op:v,stored:cur,fresh:true,expr:fmt(cur)+' '+v};
        }

        if(v==='='){
          if(op&&stored!==null){
            var cur2=parseFloat(disp)||0;
            var res=op==='+'?stored+cur2:op==='-'?stored-cur2:op==='×'?stored*cur2:cur2!==0?stored/cur2:0;
            var rounded=Math.round(res*1e10)/1e10;
            return {disp:fmt(rounded),op:null,stored:null,fresh:false,expr:expr+' '+fmt(cur2)+' ='};
          }
          return s;
        }

        /* Digit or decimal */
        if(v==='.'&&disp.indexOf('.')!==-1&&!fresh) return s;
        var newDisp=(fresh||disp==='0')?(v==='.'?'0.':v):(disp+v);
        /* Update expression to show what user is typing: "12 + 34" */
        var newExpr=op?(fmt(stored)+' '+op+' '+newDisp):newDisp;
        return {disp:newDisp,op:op,stored:stored,fresh:false,expr:newExpr};
      });
    }

    var KEYS=[
      ['C','±','%','÷'],
      ['7','8','9','×'],
      ['4','5','6','-'],
      ['1','2','3','+'],
      ['DEL','0','.','=']
    ];
    var OPS=['+','-','×','÷'];
    var UTIL=['C','±','%','DEL'];

    var rawDisp=S.disp;
    var dispNum=parseFloat(rawDisp);
    var dispStr=isNaN(dispNum)?'0':
      (rawDisp.endsWith('.')?rawDisp:
       rawDisp.indexOf('.')!==-1?
         dispNum.toLocaleString('en-US',{minimumFractionDigits:rawDisp.split('.')[1].length,maximumFractionDigits:10}):
         dispNum.toLocaleString('en-US',{maximumFractionDigits:0}));

    return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',minHeight:'calc(100vh - 120px)'}},
      /* Expression shows full running calculation */
      h('div',{style:{textAlign:'right',padding:'8px 4px 2px',minHeight:24}},
        h('p',{style:{fontSize:13,color:'#475569',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
          S.expr||' ')),
      /* Main display */
      h('div',{style:{background:'#0a0f1e',borderRadius:20,padding:'18px 20px 12px',marginBottom:10,border:'1px solid #1e293b',textAlign:'right'}},
        h('p',{style:{
          fontSize:rawDisp.length>10?22:rawDisp.length>7?30:40,
          fontWeight:900,color:'#22d3ee',lineHeight:1,fontVariantNumeric:'tabular-nums',
          overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'
        }},dispStr),
        S.op&&h('div',{style:{display:'flex',alignItems:'center',justifyContent:'flex-end',gap:6,marginTop:5}},
          h('span',{style:{fontSize:11,color:'#334155'}},'Running:'),
          h('span',{style:{fontSize:12,fontWeight:700,color:'#60a5fa'}},
            S.stored!==null?S.stored.toLocaleString('en-US',{maximumFractionDigits:8}):'—'),
          h('span',{style:{fontSize:15,fontWeight:900,color:'#22d3ee',background:'rgba(34,211,238,0.15)',borderRadius:7,padding:'1px 7px'}},S.op))),
      /* Button grid */
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,flex:1}},
        KEYS.map(function(row){
          return row.map(function(k){
            var isOp=OPS.indexOf(k)!==-1;
            var isEq=k==='=';
            var isUtil=UTIL.indexOf(k)!==-1;
            var isActive=isOp&&S.op===k;
            var bg=isEq?'linear-gradient(135deg,#22d3ee,#3b82f6)':isActive?'#f1f5f9':isOp?'#0ea5e9':isUtil?'#334155':'#1e293b';
            var fg=isEq||isActive?'#0a0f1e':'#f1f5f9';
            return h('button',{key:k,
              onMouseDown:function(e){e.preventDefault();press(k);},
              onTouchStart:function(e){e.preventDefault();press(k);},
              style:{padding:'16px 4px',background:bg,color:fg,border:'none',
                borderRadius:14,fontWeight:900,fontSize:k==='DEL'?12:20,
                cursor:'pointer',minHeight:52,
                boxShadow:isEq?'0 0 10px rgba(34,211,238,0.3)':'none',
                WebkitTapHighlightColor:'transparent'}},k);
          });
        }).reduce(function(a,b){return a.concat(b);},[])));
  }

        page==='buy'&&h(BuyPage,null),
        page==='futures'&&h(FuturesPage,null),
        page==='portfolio'&&h(PortfolioPage,null),
        page==='alerts'&&h(AlertsPage,null),
        page==='convert'&&h(ConvertPage,null),
        page==='news'&&h(NewsPage,null),
        page==='shop'&&h(ShopPage,null),
        page==='calc'&&h(CalcPage,null),
        page==='wallet'&&h(WalletPage,null),
        page==='password'&&h(PasswordPage,null),
        page==='inheritance'&&h(InheritancePage,null),
        page==='knowledge'&&h(KnowledgePage,null))),
        h('div',{style:{flexShrink:0,background:'#0f172a',borderTop:'1px solid #1e293b',display:'flex',paddingBottom:'env(safe-area-inset-bottom,0px)'}},
      NAV.map(function(item){
        var active=page===item.id;
        return h('button',{key:item.id,onClick:function(){setPage(item.id);},style:{flex:'1 1 0',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,padding:'8px 0 10px',cursor:'pointer',background:'none',border:'none',position:'relative',minWidth:0,width:0}},
          active&&h('div',{style:{position:'absolute',top:0,left:'50%',transform:'translateX(-50%)',width:20,height:2,background:'#22d3ee',borderRadius:1}}),
          h(Ico,{name:item.icon,size:19,color:active?'#22d3ee':'#475569',sw:active?2.5:1.5}),
          h('span',{style:{fontSize:9,fontWeight:600,color:active?'#22d3ee':'#475569',lineHeight:1}},item.label));
      })));


}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
})();
</script>
